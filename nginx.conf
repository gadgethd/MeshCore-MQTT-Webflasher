server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), serial=(self)" always;

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # Redirect bare /new to /new/ so the sub-site works without trailing slash
  location = /new {
    return 301 /new/;
  }

  location = /assets/firmware-data.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # New clean flasher at /new (served from new/ subdir for quick parallel run)
  location ^~ /new/ {
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), serial=(self)" always;

    # No cache for the entry point and dynamic data file
    location = /new/ {
      add_header Cache-Control "no-cache";
      try_files /new/index.html =404;
    }

    location = /new/assets/firmware-data.js {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # Long cache for immutable binaries (under /new/)
    location ~* ^/new/.*\.bin$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Short cache for json manifests under /new/
    location ~* ^/new/.*\.json$ {
      add_header Cache-Control "public, max-age=300";
      try_files $uri =404;
    }

    # Standard cache for css/js under /new/
    location ~* ^/new/.*\.(css|js)$ {
      add_header Cache-Control "public, max-age=86400";
      try_files $uri =404;
    }

    # With root, URL /new/xxx maps to /html/new/xxx . This makes directory requests serve index.html
    try_files $uri $uri/ /new/index.html =404;
  }

  location ~* \.bin$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.json$ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
