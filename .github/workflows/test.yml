name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check assets/security.js
      - run: node --check assets/app.js
      - run: node --check new/assets/app.js
      - run: node --test tests/*.test.js
      - run: node scripts/verify-firmware-release.mjs
